# Git hooks (https://lefthook.dev). Installed by `pnpm install` (root `prepare` script).
pre-commit:
  parallel: true
  jobs:
    - name: csharpier
      root: backend/
      glob: '*.{cs,csproj,props,slnx}'
      run: dotnet csharpier check {staged_files}
    - name: prettier
      root: frontend/
      glob: '*.{ts,html,css,json,md}'
      run: pnpm exec prettier --check {staged_files}
    - name: eslint
      root: frontend/
      glob: '*.{ts,html}'
      run: pnpm exec eslint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: local-ci
      run: bash scripts/ci.sh

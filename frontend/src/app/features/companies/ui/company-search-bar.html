<form
  [formGroup]="form"
  role="search"
  aria-label="Filter companies"
  (submit)="$event.preventDefault()"
>
  <div class="field grow">
    <label for="search-q">Search</label>
    <input
      id="search-q"
      type="search"
      formControlName="q"
      placeholder="Relevance search, e.g. micro"
    />
  </div>
  <div class="field">
    <label for="search-name">Name contains</label>
    <input id="search-name" type="text" formControlName="name" />
  </div>
  <div class="field">
    <label for="search-domain">Domain</label>
    <input id="search-domain" type="text" formControlName="domain" placeholder="example.com" />
  </div>
  <div class="field">
    <label for="search-sort">Sort</label>
    <select id="search-sort" formControlName="sort">
      <option value="">Default</option>
      <option value="relevance">Relevance</option>
      <option value="name">Name (A–Z)</option>
      <option value="-name">Name (Z–A)</option>
      <option value="-createdAt">Newest first</option>
      <option value="createdAt">Oldest first</option>
    </select>
  </div>
</form>
